# Las Tajemnic — theme of Stowarzyszenie Larpowe "Las Tajemnic" only.
# Other organizations: create your own with  bin/console app:theme:create <name>
name: Las Tajemnic
description: 'Drzeworyt w czerni i kości, z driadą z logo'
extends: base

# Loaded after the base theme's CSS, in this order.
styles:
    - fonts.css
    - tokens.css
    - components.css
    - effects.css

# Fonts used above the fold (menu, headings): preloaded so the header doesn't
# shift when they arrive.
preload:
    - fonts/saira-extra-condensed-latin-600-normal.woff2
    - fonts/saira-extra-condensed-latin-700-normal.woff2
    - fonts/inter-latin-400-normal.woff2

# Small progressive enhancements (spores in the hero, reveal on scroll).
scripts:
    - effects.js
