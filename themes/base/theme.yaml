# Base theme: clean, calm and neutral. Every other theme extends it.
name: Base
description: Neutral, modern starting point. Extend it instead of editing it.
# extends: (none: this is the root theme)

# CSS files in assets/styles/, loaded in this order (after any parent theme's files).
styles:
    - tokens.css
    - base.css
    - components.css
    - effects.css

# Fonts (paths in assets/) to preload, e.g. the heading font used in the menu.
preload: []

# JS modules in assets/scripts/ (plain ES modules, no imports from npm).
scripts: []
